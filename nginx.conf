user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;

    # Preserve the original path across the internal redirect to index.php.
    map $request_uri $request_path {
        ~^(?<original_path>[^?]*) $original_path;
        default $uri;
    }

    log_format application_json escape=json
        '{"timestamp":"$time_iso8601",'
        '"method":"$request_method",'
        '"path":"$request_path",'
        '"status":$status,'
        '"request_time":$request_time,'
        '"X-Amzn-Trace-Id":"$http_x_amzn_trace_id"}';

    # request_time is elapsed time in seconds. Log every request, including /up and static files.
    access_log /dev/stdout application_json;

    server {
        listen 80 default_server;
        server_name _;
        root /var/www/html/public;
        index index.php;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /index.php {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param HTTP_X_AMZN_TRACE_ID $http_x_amzn_trace_id;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_connect_timeout 5s;
            fastcgi_read_timeout 60s;
        }

        location ~ \.php(?:/|$) {
            return 404;
        }

        location ~ /\. {
            deny all;
        }
    }
}
